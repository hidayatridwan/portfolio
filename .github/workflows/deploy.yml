name: Deploy Portfolio

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/ubuntu
          chmod 600 ~/.ssh/ubuntu
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
          # Diagnostics: validate the key parses and show its fingerprint
          echo "=== Private key sanity check ==="
          head -1 ~/.ssh/ubuntu
          tail -1 ~/.ssh/ubuntu
          ssh-keygen -y -f ~/.ssh/ubuntu > /tmp/derived.pub && echo "Key parsed OK" || echo "KEY IS INVALID/CORRUPT"
          echo "=== Public key derived from the secret (must be in VPS authorized_keys) ==="
          cat /tmp/derived.pub

      - name: SSH connectivity test (verbose)
        run: |
          ssh -v -o IdentitiesOnly=yes -i ~/.ssh/ubuntu \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "echo CONNECTED as \$(whoami) on \$(hostname)" || true

      - name: Create deploy directory
        run: |
          ssh -o IdentitiesOnly=yes -i ~/.ssh/ubuntu \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "mkdir -p ${{ secrets.VPS_DEPLOY_PATH }}"

      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -o IdentitiesOnly=yes -i ~/.ssh/ubuntu" \
            --rsync-path="mkdir -p ${{ secrets.VPS_DEPLOY_PATH }} && rsync" \
            ./dist/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_DEPLOY_PATH }}/